name: temuka-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TEMUKA_UID: ${TEMUKA_UID:-1000}
        TEMUKA_GID: ${TEMUKA_GID:-1000}
    working_dir: /var/www/html
    user: temuka
    volumes:
      - .:/var/www/html
    ports:
      - "127.0.0.1:${TEMUKA_API_PORT:-8020}:8000"
    environment:
      APP_NAME: Temuka
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:${TEMUKA_API_PORT:-8020}
      LOG_CHANNEL: stack
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-temuka_dev}
      DB_USERNAME: ${DB_USERNAME:-temuka_local}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the ignored .env file}
      DB_URL: ""
      COMPOSER_HOME: /tmp/composer
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/v1/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0.40
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-temuka_dev}
      MYSQL_USER: ${DB_USERNAME:-temuka_local}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the ignored .env file}
      MYSQL_ROOT_PASSWORD: ${TEMUKA_DB_ROOT_PASSWORD:?Set TEMUKA_DB_ROOT_PASSWORD in the ignored .env file}
    volumes:
      - temuka-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  temuka-mysql-data:
